server {
    listen 80;

    client_max_body_size 500M;

    # Sonde de vie servie par nginx lui-même (ne touche ni gunicorn ni Django),
    # afin que Docker détecte un nginx mort.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/data/media/;
    }

    location / {
        # Résolution DNS à chaque requête via le resolver interne de Docker :
        # sans cela nginx figerait l'IP du conteneur « web » à son démarrage et
        # tomberait en erreur 502 dès que celui-ci est recréé.
        resolver 127.0.0.11 valid=10s;
        set $upstream http://web:8000;
        proxy_pass $upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
